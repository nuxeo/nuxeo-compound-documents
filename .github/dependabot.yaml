version: 2
updates:
  # Default branch: 2023

  # Maven
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
    ignore:
      # Major and minor version updates
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

      # Nuxeo dependencies Dependabot would try to fetch unnecessarily
      - dependency-name: "org.nuxeo.*"

      # Nuxeo parent POM
      - dependency-name: "org.nuxeo:nuxeo-parent"
        update-types:
          - "version-update:semver-patch"

  # npm
  - package-ecosystem: "npm"
    directory: "/nuxeo-compound-documents-web"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      nuxeo-version-updates:
        applies-to: "version-updates"
        patterns:
          - "@nuxeo/*"
      version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
    ignore:
      # Ignore Nuxeo @nuxeo/* versions >= 2025.0.0
      - dependency-name: "@nuxeo/*"
        versions:
          - ">=2025.0.0"

      # Major and minor version updates
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"

  # Branch 2025

  # Maven
  - package-ecosystem: "maven"
    target-branch: "2025"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      version-updates:
        patterns:
          - "*"
    ignore:
      # Major version updates
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

      # Nuxeo dependencies Dependabot would try to fetch unnecessarily
      - dependency-name: "org.nuxeo.*"

      # Nuxeo parent POM
      - dependency-name: "org.nuxeo:nuxeo-parent"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # npm
  - package-ecosystem: "npm"
    target-branch: "2025"
    directory: "/nuxeo-compound-documents-web"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      nuxeo-version-updates:
        patterns:
          - "@nuxeo/*"
      version-updates:
        patterns:
          - "*"
    ignore:
      # Major version updates
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    target-branch: "2025"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      version-updates:
        patterns:
          - "*"
